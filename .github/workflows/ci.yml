name: Sign-in regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signin-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signin-regression:
    name: Sign-in regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax and sign-in contract
        run: npm test
